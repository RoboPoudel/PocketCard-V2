name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle directly, so gradle-wrapper.jar is not needed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts was not found. Please upload the project files."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in: $(pwd)"
          gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-cards-apk
          path: '**/app/build/outputs/apk/release/*.apk'
