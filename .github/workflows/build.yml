name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unpack the uploaded zip
        run: |
          ZIP=$(find . -maxdepth 3 -iname "PocketCards*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            echo "ROOT=$RUNNER_TEMP/src" >> "$GITHUB_ENV"
          else
            echo "No zip found, using the files in the repository"
            echo "ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Check project files
        run: |
          cd "$ROOT"
          SETTINGS=$(find . -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "### settings.gradle.kts not found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          DIR="$ROOT/$(dirname "$SETTINGS")"
          echo "PROJECT=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          MISSING=""
          for f in build.gradle.kts gradle.properties app/build.gradle.kts \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/res/values/strings.xml \
                   app/src/main/res/drawable-nodpi/logo_art.png \
                   app/src/main/java/com/pocketcards/app/MainActivity.kt; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "### These files are missing" >> "$GITHUB_STEP_SUMMARY"
            for f in $MISSING; do echo "- $f" >> "$GITHUB_STEP_SUMMARY"; done
            exit 1
          fi
          if [ ! -f app/pocketcards.keystore ]; then
            echo "### Note: signing key was missing, a temporary one was created" >> "$GITHUB_STEP_SUMMARY"
            keytool -genkeypair -keystore app/pocketcards.keystore -alias pocketcards \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass pocketcards2026 -keypass pocketcards2026 -dname "CN=Pocket Cards"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT"
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show the error
        if: failure()
        run: |
          [ -n "$PROJECT" ] && [ -f "$PROJECT/build.log" ] || exit 0
          {
            echo "### Build errors"
            echo '```'
            grep -E "^e: " "$PROJECT/build.log" | head -n 40
            grep -A 8 "What went wrong" "$PROJECT/build.log" | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-cards-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/release/*.apk
