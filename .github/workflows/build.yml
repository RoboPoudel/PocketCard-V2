name: Build APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: PocketCards

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-cards-apk
          path: PocketCards/app/build/outputs/apk/release/*.apk
